<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8e1b1b" />
    <title>Offline · SpendSense</title>
    <style>
      :root {
        /* Mirrors the din/raat tokens in src/frontend/styles/globals.css. */
        --bg: #f3e3b5;
        --fg: #3a1d0e;
        --muted: #7a5a3a;
        --primary: #8e1b1b;
        --on-primary: #f3e3b5;
        --rule: #c9b07a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e0f0a;
          --fg: #efe2c0;
          --muted: #c2ab8a;
          --primary: #d9574a;
          --on-primary: #1e0f0a;
          --rule: #4a2a1e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
        padding: 24px;
        border: 1px solid var(--rule);
        border-left: 2px solid var(--primary);
        border-radius: 4px;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 4px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 20px;
        border: 0;
        border-radius: 4px;
        background: var(--primary);
        color: var(--on-primary);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>SpendSense needs a connection to load your khata. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
